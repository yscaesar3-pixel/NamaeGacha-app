workflows:
  namaegacha-ios-release:
    name: なまえガチャ iOS Release
    max_build_duration: 30
    integrations:
      app_store_connect: oddiro_asc_key
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.yutaXXX.namaegacha
      vars:
        XCODE_PROJECT: "ios/App/App.xcodeproj"
        XCODE_SCHEME: "App"
        APP_VERSION: "1.0.1"
        # リリース用設定。本番広告IDを使用する。
        ADMOB_USE_PRODUCTION: "true"
      node: latest
      xcode: latest
      cocoapods: default
    scripts:
      - name: npm install
        script: |
          npm install

      - name: Select AdMob test or production mode
        script: |
          if [ "${ADMOB_USE_PRODUCTION:-false}" = "true" ]; then
            sed -i '' -E 's/const USE_TEST_ADS = (true|false);/const USE_TEST_ADS = false;/' www/js/ads.js
            echo "AdMob mode: production"
          else
            sed -i '' -E 's/const USE_TEST_ADS = (true|false);/const USE_TEST_ADS = true;/' www/js/ads.js
            echo "AdMob mode: Google official test banner"
          fi

      - name: Capacitor sync (SPM, no CocoaPods)
        script: |
          npx cap sync ios

      - name: Set app version and Codemagic build number
        script: |
          cd ios/App
          sed -i '' "s/MARKETING_VERSION = [^;]*;/MARKETING_VERSION = $APP_VERSION;/g" App.xcodeproj/project.pbxproj
          sed -i '' "s/CURRENT_PROJECT_VERSION = .*/CURRENT_PROJECT_VERSION = $PROJECT_BUILD_NUMBER;/" App.xcodeproj/project.pbxproj

      - name: Apply fetched signing files to Xcode project
        script: |
          xcode-project use-profiles

      - name: Build ipa for App Store
        script: |
          xcode-project build-ipa \
            --project "$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME"

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        auth: integration
        beta_groups:
          - App Store Connect Users  # ASC側の実際のInternal Testingグループ名に置き換えてください
